name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build macos --release
      - name: Zip app
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          mkdir -p dist
          (
            cd build/macos/Build/Products/Release
            zip -r "../../../../../dist/bulky-${VERSION}-macos.zip" bulky.app
          )
      - uses: actions/upload-artifact@v4
        with:
          name: bulky-macos
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Zip app
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s+(\S+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\bulky-$version-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bulky-windows
          path: dist/*.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
