name: bulky
description: Windows and macOS bulk YouTube uploader for the bulky workspace.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  crypto: ^3.0.6
  dio: ^5.9.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  file_picker: ^10.3.3
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  wakelock_plus: ^1.3.3
  window_manager: ^0.5.1
  desktop_webview_window: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.29.0

flutter:
  uses-material-design: true
